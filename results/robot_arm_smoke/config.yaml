project:
  name: vision-diff-physics-robot-arm
  output_dir: results/robot_arm_smoke
seed: 13
device: auto
runtime:
  num_threads: 1
robot:
  link_lengths:
  - 0.36
  - 0.28
  - 0.18
  joint_limit: 2.85
  max_delta: 1.75
  rollout_steps: 24
data:
  image_size: 96
  train_samples: 512
  val_samples: 128
  batch_size: 32
  num_workers: 0
  image_noise_std: 0.01
model:
  feature_dim: 128
  base_channels: 16
  hidden_dim: 128
training:
  epochs: 3
  lr: 0.001
  min_lr: 1.0e-05
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  imitation_weight: 0.05
  smoothness_weight: 0.001
isaac_sim:
  output_dir: datasets/isaac_franka
  headless: true
  num_steps: 600
  camera_resolution:
  - 640
  - 480
  save_every: 4
warp:
  enabled: false
  device: cuda
splatting:
  image_size: 128
