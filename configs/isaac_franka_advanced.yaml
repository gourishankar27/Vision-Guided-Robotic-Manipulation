project:
  name: vision-diff-physics-isaac-franka-advanced
  output_dir: results/isaac_franka_advanced
seed: 23
device: auto
runtime:
  num_threads: 1

data:
  # Use one JSONL or several via index_paths. CLI --index overrides this.
  index_path: datasets/isaac_franka_v2/index.jsonl
  # index_paths:
  #   - datasets/franka_many/episode_000/index.jsonl
  #   - datasets/franka_many/episode_001/index.jsonl
  image_size: 128
  batch_size: 8
  num_workers: 0
  cache_images: false
  # none = raw RGB. percentile is useful for under-exposed Isaac frames.
  image_preprocess: percentile
  augment: true
  brightness_jitter: 0.04
  contrast_jitter: 0.15
  noise_std: 0.005
  image_dropout_prob: 0.02
  context_len: 4
  horizon: 8
  stride: 1
  val_fraction: 0.2
  split_mode: episode      # episode = honest holdout by entire Isaac episodes
  max_windows: null
  require_contiguous_steps: true
  expected_step_delta: null   # null means infer any constant positive step spacing per window
  max_ee_step: 0.25           # meters; filters reset/teleport windows
  max_q_step: 1.50            # radians L2; filters robot reset windows

model:
  feature_dim: 192
  base_channels: 24
  embed_dim: 256
  num_layers: 2
  num_heads: 4
  dropout: 0.05
  vision_dropout: 0.05
  state_dropout: 0.00
  max_delta: 0.20

loss:
  delta: 1.0
  q: 0.5
  ee: 10.0
  terminal_ee: 3.0
  smooth: 0.05
  joint_limit: 0.02
  fk_consistency: 0.0   # set 0.05 after checking FK calibration on your scene
  goal: 0.0             # optional, because EE target is not always object place target

training:
  epochs: 80
  lr: 0.0003
  min_lr: 1.0e-05
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stop_patience: 18
