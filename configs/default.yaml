project:
  name: vision-diff-physics
  output_dir: results/default_run
seed: 7
device: auto
runtime:
  num_threads: 1              # keeps small CPU demos fast; raise for large runs
properties:
  mins: [0.5, 0.2, 0.02]      # mass, restitution, friction
  maxs: [3.0, 0.95, 0.6]
simulation:
  dt: 0.02
  horizon: 60                  # set to 200 to match the architecture diagram
  bounds: [0.0, 1.0, 0.0, 1.0]
  radius: 0.045
  friction_acceleration: 1.5
  linear_damping: 0.03
  velocity_epsilon: 0.03
data:
  image_size: 64
  train_samples: 128
  val_samples: 32
  test_samples: 32
  batch_size: 32
  num_workers: 0
  action_scale: 0.65
  observation_noise_std: 0.001
model:
  feature_dim: 128
  base_channels: 16
  hidden_dim: 128
training:
  epochs: 12
  lr: 0.001
  min_lr: 0.00001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  property_aux_weight: 0.02     # set 0.0 for pure trajectory-only system ID
  save_every: 5
evaluation:
  checkpoint: results/default_run/checkpoints/best.pt
  max_overlay_samples: 8
